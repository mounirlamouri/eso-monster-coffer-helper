name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lupa
        run: python -m pip install lupa

      - name: Lua tests
        run: python tests/run.py

      - name: No globals besides MonsterCofferHelper
        run: python tests/check_globals.py

      - name: Release zip builds
        run: python package.py --dry-run
